name: Test message content access

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Check message content
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_REACTION_CHANNEL_ID: ${{ vars.DISCORD_REACTION_CHANNEL_ID }}
        run: |
          python -c "
          import os, requests, discord_roles
          token = os.environ['DISCORD_BOT_TOKEN']
          channel_id = os.environ['DISCORD_REACTION_CHANNEL_ID']
          resp = requests.get(f'{discord_roles.DISCORD_API}/channels/{channel_id}/messages', headers=discord_roles._headers(token), params={'limit': 3}, timeout=10)
          print(resp.status_code)
          for m in resp.json():
              print(repr(m.get('content')), '| author:', m.get('author', {}).get('username'))
          "
