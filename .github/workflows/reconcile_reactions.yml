name: Reconcile reaction roles

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "porygon-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Reconcile
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_REACTION_CHANNEL_ID: ${{ vars.DISCORD_REACTION_CHANNEL_ID }}
          DISCORD_REACTION_MESSAGE_ID: ${{ vars.DISCORD_REACTION_MESSAGE_ID }}
          REACTION_ROLE_MAP: ${{ vars.REACTION_ROLE_MAP }}
        run: python reconcile_reactions.py

      - name: Commit updated reaction state
        run: |
          git add reaction_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reconcile reaction-role state [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          echo "Failed to push reaction_state.json after retries" >&2
          exit 1

