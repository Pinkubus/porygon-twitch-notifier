name: Check Twitch live status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: twitch-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Run notifier
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          TWITCH_STREAMS_WEBHOOK_URL: ${{ secrets.TWITCH_STREAMS_WEBHOOK_URL }}
          TWITCH_CHANNELS: ${{ vars.TWITCH_CHANNELS }}
        run: python notifier.py

      - name: Commit updated state
        run: |
          git config user.name "porygon-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Update live/offline state [skip ci]"
            git push
          fi
