name: Check Twitch live status

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_seconds:
        description: "Override loop duration (seconds) — for quick test runs"
        required: false

permissions:
  contents: write

concurrency:
  group: twitch-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "porygon-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run continuous loop
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          TWITCH_STREAMS_WEBHOOK_URL: ${{ secrets.TWITCH_STREAMS_WEBHOOK_URL }}
          TWITCH_CHANNELS: ${{ vars.TWITCH_CHANNELS }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          LOOP_MAX_SECONDS: ${{ github.event.inputs.max_seconds }}
        run: python loop.py

